services:
  app:
    image: docker.io/library/php:8.5-cli
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app:Z
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  postgres:
    image: docker.io/library/postgres:18
    env_file:
      - .env
    ports:
      - "5432:5432"
